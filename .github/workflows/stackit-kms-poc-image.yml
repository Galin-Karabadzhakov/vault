name: STACKIT KMS PoC image

on:
  push:
    branches:
      - feat/stackit-kms-auto-unseal
    tags:
      - stackit-kms-v*

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'Galin-Karabadzhakov/vault'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Build Vault
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/vault .

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "IMAGE_TAG=stackit-kms-poc-${GITHUB_SHA}" >> "${GITHUB_ENV}"
          fi

      - name: Build and push PoC image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/stackit-kms-poc/Dockerfile
          push: true
          tags: |
            ghcr.io/galin-karabadzhakov/vault:${{ env.IMAGE_TAG }}
            ghcr.io/galin-karabadzhakov/vault:stackit-kms-poc
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Galin-Karabadzhakov/vault
            org.opencontainers.image.title=Vault STACKIT KMS auto-unseal PoC
