name: STACKIT KMS PoC image

on:
  push:
    branches:
      - feat/stackit-kms-auto-unseal
    tags:
      - stackit-kms-v*

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'Galin-Karabadzhakov/vault'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/package.json

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          package_json_file: ./ui/package.json

      - name: Build Vault UI
        env:
          GOWORK: "off"
        run: make ci-build-ui

      - name: Build Vault
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -tags ui -ldflags "-s -w" -o dist/vault .

      - name: Verify embedded Vault UI
        shell: bash
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/vault.hcl" <<'EOF'
          ui = true
          disable_mlock = true

          listener "tcp" {
            address = "127.0.0.1:18200"
            tls_disable = true
          }

          storage "inmem" {}
          EOF

          dist/vault server -config="${RUNNER_TEMP}/vault.hcl" \
            >"${RUNNER_TEMP}/vault.log" 2>&1 &
          vault_pid=$!
          trap 'kill "${vault_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --fail --location --max-time 2 --silent \
              http://127.0.0.1:18200/ui/ \
              --output "${RUNNER_TEMP}/vault-ui.html"; then
              break
            fi
            sleep 1
          done

          if [[ ! -s "${RUNNER_TEMP}/vault-ui.html" ]]; then
            cat "${RUNNER_TEMP}/vault.log" >&2
            exit 1
          fi
          if grep --quiet "Vault UI is not available in this binary" \
            "${RUNNER_TEMP}/vault-ui.html"; then
            echo "Vault binary does not contain the embedded UI" >&2
            exit 1
          fi
          grep --quiet '<!DOCTYPE html>' "${RUNNER_TEMP}/vault-ui.html"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "IMAGE_TAG=stackit-kms-poc-${GITHUB_SHA}" >> "${GITHUB_ENV}"
          fi

      - name: Build and push PoC image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/stackit-kms-poc/Dockerfile
          push: true
          tags: |
            ghcr.io/galin-karabadzhakov/vault:${{ env.IMAGE_TAG }}
            ghcr.io/galin-karabadzhakov/vault:stackit-kms-poc
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Galin-Karabadzhakov/vault
            org.opencontainers.image.title=Vault STACKIT KMS auto-unseal PoC
